# Configuracion de enlazado para la ROM DOS 1541 clean room.
# Produce una imagen plana de exactamente 16384 bytes ($C000-$FFFF).
# Solo describe el mapa de hardware (Nivel A): direcciones publicas del 6502
# y de las dos VIA. No contiene ninguna direccion interna de Commodore.

MEMORY {
    # RAM de 2 KB de la 1541. El reparto fino (pagina cero del DOS, pila,
    # buffers de sector) se definira al implementar el sistema de ficheros.
    ZP:   start = $0000, size = $0090, type = rw, define = yes;
    RAM:  start = $0100, size = $0700, type = rw, define = yes;

    # 16 KB de ROM. fillval $FF imita una EPROM borrada en los huecos.
    ROM:  start = $C000, size = $4000, type = ro, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    VECTORS:  load = ROM, type = ro, start = $FFFA;
}
